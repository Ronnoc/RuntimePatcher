name: Release

# Tag push (vX.Y.Z): build the runtime from the FEFW_GAME_PROFILE secret and publish a GitHub release.
# Manual run (Actions tab -> Release -> Run workflow): same build, uploaded as a workflow artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($v)"; exit 1
          fi

      - name: Check secret
        env:
          FEFW_GAME_PROFILE: ${{ secrets.FEFW_GAME_PROFILE }}
        run: |
          if [ -z "$FEFW_GAME_PROFILE" ]; then
            echo "::error::repository secret FEFW_GAME_PROFILE is not set (see README: Releases)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          cmake -S . -B build/host
          cmake --build build/host --config Release --parallel
          ctest --test-dir build/host -C Release --output-on-failure

      # The pinned libc++ headers (tools/fetch_third_party.py) need the matching clang; the runner's LLVM is older.
      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: C:\llvm
          key: llvm-23.1.5-x86_64-pc-windows-msvc

      - name: Install LLVM 23.1.5
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          name=clang+llvm-23.1.5-x86_64-pc-windows-msvc
          curl -sSfL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.5/$name.tar.xz"
          mkdir -p /c/llvm && tar -xf llvm.tar.xz -C /c/llvm --strip-components=1 && rm llvm.tar.xz

      - name: Use LLVM 23.1.5
        run: |
          echo 'C:\llvm\bin' >> "$GITHUB_PATH"
          /c/llvm/bin/clang --version | head -1

      - name: Fetch third-party headers
        run: python tools/fetch_third_party.py

      - name: Build runtime
        env:
          FEFW_GAME_PROFILE: ${{ secrets.FEFW_GAME_PROFILE }}
        run: python tools/build_emulator_mod.py foundation --out-dir out

      - name: Package
        run: |
          pkg="out/release/emulator_ready/04007EF01F8AE000"
          cp LICENSE LEGAL.md THIRD_PARTY_NOTICES.md "$pkg/FEFW_RuntimePatcher/"
          (cd "$pkg" && 7z a -tzip "$GITHUB_WORKSPACE/FEFW_RuntimePatcher-$VERSION.zip" FEFW_RuntimePatcher > /dev/null)
          git archive --format=zip --prefix="RuntimePatcher-$VERSION/" -o "RuntimePatcher-$VERSION-src.zip" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: FEFW_RuntimePatcher-${{ env.VERSION }}
          path: FEFW_RuntimePatcher-${{ env.VERSION }}.zip

      - name: Release notes
        if: github.ref_type == 'tag'
        run: |
          awk -v v="$VERSION" '/^## /{p = ($2 == "[" v "]" || $2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          {
            echo
            echo "### Install"
            echo "Unzip \`FEFW_RuntimePatcher-$VERSION.zip\` into \`<emulator>/load/04007EF01F8AE000/\` and enable"
            echo "\`FEFW_RuntimePatcher\` in the emulator's add-on list. Built for one game version; see the README."
          } >> notes.md

      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$VERSION" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "FEFW_RuntimePatcher-$VERSION.zip" "RuntimePatcher-$VERSION-src.zip" \
            --title "RuntimePatcher $VERSION" --notes-file notes.md $pre
